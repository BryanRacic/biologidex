<!DOCTYPE html>
<html><head>
<meta http-equiv="content-type" content="text/html; charset=UTF-8">
    <meta charset="utf-8">
    <title>Ad</title>
    <link rel="stylesheet" href="300x600_data/style.min.css">
    <script type="text/javascript" src="300x600_data/AMOLibrary.js"></script>
    <script src="300x600_data/script.min.js" charset="utf-8"></script>
    <style media="screen">
      @font-face {
          font-family: SegoePro-Semibold;
          src: url('fonts/SegoePro-Semibold.woff') format("woff");
      }
      .segoeProSemibold { font-family: SegoePro-Semibold; }
    </style>
    <!--
      Available Classes:-
        For Images :-
          .asset        -Image Center Align(Image can shrink according to the container but will expand beyond its original size)
          .asset-top    -Image Top Center Align(Image can shrink according to the container but will expand beyond its original size)
          .asset-left

    -->
    <style media="screen">
      #ad {
        width: 300px;
        height: 600px;
        font-family: Arial,Helvetica,sans-serif;
        background-color: #fff;
      }
      #cta { background-color: #0078d4; }
      #cta:hover { background-color: #1384da; }
    </style>
  </head>
  <body>
    <div class="ad" id="ad"><div id="backgroundImage" class="asset" style="width:inherit; height:inherit;"><img src="300x600_data/1a7566f8b44aa5fd0cdf5b811da7cf11.png"></div><div id="textfields" dir="auto" class="text-top-left segoeProSemibold" style="top: 91px; left: 15px; width: 270px; height: 110px; font-size: 19px; line-height: 1.2; color: rgb(0, 0, 0);"><span><font id="headlineText" style="display:inline-block;min-height:20px;padding-bottom:8px;width:100%;">Your tools.<br>Your frameworks.<br>Your cloud.</font><font id="subheadlineText" style="display:inline-block;font-size:70%;">Pay only for what you use beyond free amounts.</font></span></div><div id="cta" dir="auto" class="text segoeProSemibold" data-style="text-align:left;padding:5px 10px;" style="top:554px; left:0px; width:300px; height:45px; font-size:14px; line-height:1; white-space:nowrap; color:#fff;"><span style="text-align:left;padding:5px 10px;">Try Azure&nbsp;❯</span></div><div id="overlay" style="top: 0px; left: 0px; width: inherit; height: inherit; background-color: rgb(255, 255, 255); opacity: 0; transition: 0.5s; visibility: hidden;"></div><div class="ad-borders"><div class="ad-border-top" style="position:absolute;display:inline-block;width:300px;border-top:2px solid #d1d1d1;top:0px;left:0px;"></div><div class="ad-border-right" style="position:absolute;display:inline-block;height:600px;border-left:2px solid #d1d1d1;top:0px;left:298px;"></div><div class="ad-border-bottom" style="position:absolute;display:inline-block;width:300px;border-top:2px solid #d1d1d1;top:598px;left:0px;"></div><div class="ad-border-left" style="position:absolute;display:inline-block;height:600px;border-left:2px solid #d1d1d1;top:0px;left:0px;"></div></div></div>
    <div id="loadFont" style="width:0;height:0;overflow:hidden;">
      <div class="segoeProSemibold" style="color:transparent;">segoeProSemibold</div>
    </div>
    <script type="text/javascript">
      var ad = new Ad({
        root: document.querySelector('#ad'),
        width: 300,
        height: 600,
        borderWidth: 2,
        borderColor: '#d1d1d1'
      });
      setTimeout(function() {
        ad.contentSetup({
          cam: {
            headlineText: 'Build containerized apps with tools you love',
            //headlineText: 'Why Azure?',
            layout: 'TPV4',
            //subheadlineText:  'Start building apps today with 25+ free services and a $200 credit',
            subheadlineText: 'Quisque suscipit suscipit accumsan. Morbi gravida hendrerit massa.',
            //backgroundImage: 'assets/FreeAccount_300x600.png',
            backgroundImage: 'assets/300x600_Free Account_UI_EndFr.png',
            ctaText: 'Try Azure free',
            clickURL: 'https://azure.microsoft.com/',
            impressionTracker: 'images/1x1.png'
          },
          feed: [
            {
              name: 'ms',
              passthroughfield5:'#FF0000|#FF00FF'
            }
          ],
          staticData: {
            // ref:'ref.png',
          },
          beforeLoad: function(data){
            var replaceMacro = function(text, data) {
              var macros = text.match(/\!\{(.*?)\}/g);
              if(macros) {
                macros.forEach(function(macro){
                  var macroText = macro.split('!{').join('').split('}').join('');
                  for(var key in data) { if(key == macroText) { macroText = data[key]; } }
                  text = text.split(macro).join(macroText);
                });
              }
              return text;
            }
            data.map(function(content){
              content.ctaText +='&nbsp;&#x276F;';
              if(content.layout.toLowerCase() === 'tpv7') {
                ad.root.querySelector('#cta').style.color = content.passthroughfield5.split('|')[1];
                ad.root.querySelector('#textfields').style.color = content.passthroughfield5.split('|')[0];
              }
              if(content.headlineText.split('|').length > 1) {
                  var fontSize = content.headlineText.split('|')[1];
                  content.headlineText = content.headlineText.split('|')[0];
                  if(fontSize) ad.root.querySelector('#headlineText').style.fontSize = fontSize + 'px';
              }
              if(content.subheadlineText.split('|').length > 1) {
                  var fontSize = content.subheadlineText.split('|')[1];
                  content.subheadlineText = content.subheadlineText.split('|')[0];
                  if(fontSize) ad.root.querySelector('#subheadlineText').style.fontSize = fontSize + 'px';
              }
              if(content.headlineText.toLowerCase() === 'na') {
                ad.root.querySelector('#headlineText').style.display = 'none';
              }
              if(content.subheadlineText.toLowerCase() === 'na') {
                ad.root.querySelector('#subheadlineText').style.display = 'none';
              }
              if(content.layout.toLowerCase() === 'tpv4') {
                ad.root.querySelector('#cta').style.whiteSpace = 'nowrap';
                if(content.passthroughfield5 != ""){
                  ad.root.querySelector('#textfields').style.color = content.passthroughfield5.split('|')[0];
                }
              } else {
                ad.root.querySelector('#textfields').style.height = '290px';
                ad.root.querySelector('#textfields').style.fontSize = '21px';
                ad.root.querySelector('#textfields').style.letterSpacing = '-0.2px';
                ad.root.querySelector('#textfields #headlineText').style.minHeight = '27px';
                ad.root.querySelector('#textfields #headlineText').style.paddingBottom = '5px';
                ad.root.querySelector('#textfields #subheadlineText').style.fontSize = '77%';
              }
            });
            return data;
          }
        }, function(data){
          var adData = data[0], adClickUrl = adData['clickURL'];
          ad.root.addEventListener("click", function(e) {
            if('button' in e.target.dataset) { } else { amo.onDynAdClick(adData.feedData, "CLICK", adClickUrl); }
          });
          if(adData.impressionTracker.toLowerCase() != 'na'){
            var impressionTracker = adData.impressionTracker.split('^')[0];
            var isn = 'data' in amo && 'isn' in amo.data ? amo.data.isn : '';
            var trackingCode = 'data' in amo && 'data' in amo.data && 'atsParams' in amo.data.data && 'x2_tracking_code_5' in amo.data.data.atsParams ? amo.data.data.atsParams.x2_tracking_code_5 : '';
            if(isn.length) { impressionTracker = impressionTracker.replace('(t_td_isn)', isn); }
            if(trackingCode.length){ impressionTracker = impressionTracker.replace('$(t_qp_TC_5)', trackingCode); }
            ad.loadAssets(impressionTracker, function(assets){ });
          }
          if(adData.impressionTracker.indexOf('^') != -1){
            var impressionTrackerAAM = adData.impressionTracker.split('^')[1];
            var isn = 'data' in amo && 'isn' in amo.data ? amo.data.isn : '';
            var trackingCode = 'data' in amo && 'data' in amo.data && 'atsParams' in amo.data.data && 'x2_tracking_code_5' in amo.data.data.atsParams ? amo.data.data.atsParams.x2_tracking_code_5 : '';
            if(isn.length) { impressionTrackerAAM = impressionTrackerAAM.replace('(t_td_isn)', isn); }
            if(trackingCode.length){ impressionTrackerAAM = impressionTrackerAAM.replace('$(t_qp_TC_5)', trackingCode); }
            ad.loadAssets(impressionTrackerAAM, function(assets){ });
          }
          if(adData.layout.toLowerCase() === 'tpv4') {
            ad.layers.cta.style.webkitTransform = '';
            ad.layers.cta.style.transform = '';
          }
        });
      }, 100);
    </script>
  

</body></html>
